behaviors:
  SpaceCleaner:
    trainer_type: spacecleaner_ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 32768
      learning_rate: 2.5e-4
      beta: 7.5e-3
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
      action_smoothness_coef: 0.01
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 32
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 10000
    threaded: true

environment_parameters:
  difficulty_level:
    curriculum:
      - name: starter-arena
        completion_criteria:
          measure: reward
          behavior: SpaceCleaner
          signal_smoothing: true
          min_lesson_length: 50
          threshold: 1.5
        value: 0.0
      - name: wider-search
        completion_criteria:
          measure: reward
          behavior: SpaceCleaner
          signal_smoothing: true
          min_lesson_length: 75
          threshold: 3.0
        value: 0.35
      - name: moving-debris
        completion_criteria:
          measure: reward
          behavior: SpaceCleaner
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 5.5
          require_reset: true
        value: 0.7
      - name: full-scene
        value: 1.0
